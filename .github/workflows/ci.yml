name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Compile contracts
        run: npm run contracts:compile

      - name: Test contracts
        run: npm run contracts:test

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
